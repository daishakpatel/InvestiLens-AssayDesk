# Which metrics apply to which sector (DR-042). Data, not code branches. Source: Appendix C.
# `false` means "Not applicable for this sector" (render as N/A, never zero/blank; DR-001).
sectors:
  standard:
    gross_margin: true
    gross_profit: true
    cost_of_revenue: true
    roic: true
    current_ratio: true
    ev_ebitda: true
    piotroski: true
    altman: true
    beneish: true
    pe: true
    ps: true
    net_interest_margin: false
  bank:
    gross_margin: false
    gross_profit: false       # a bank has no cost of goods: N/A, not a missing quarter (FR-QT-010)
    cost_of_revenue: false
    roic: false               # deposits are funding, not invested capital
    current_ratio: false
    ev_ebitda: false
    # No operating-income line (net revenue, noninterest expense, pretax income) and no capex tag
    # (investing outflows are securities): these and the ratios built on them are N/A, not missing.
    operating_income: false
    operating_margin: false
    ebitda: false
    capex: false
    free_cash_flow: false
    fcf_margin: false
    capex_intensity: false
    piotroski: false
    altman: false
    # Beneish was estimated on non-financial firms; banks were excluded (ADR-0042, DR-EQ-001).
    beneish: false
    # No receivables/inventory/payables cycle and no SG&A line: working-capital days are N/A.
    dso: false
    dio: false
    dpo: false
    cash_conversion_cycle: false
    accruals_ratio_bs: false  # deposits and loans are the operations: NOA has no meaning
    sga_expense: false
    # Banks are valued on tangible book, which needs goodwill and intangibles mapped (Phase 7h):
    # until then price-to-book is N/A rather than a misleading multiple.
    pb_ratio: false
    pe: true
    ps: true
    net_interest_margin: true   # [P2]
  reit:
    gross_margin: false
    gross_profit: false
    cost_of_revenue: false
    roic: true
    current_ratio: false
    ev_ebitda: true
    piotroski: true
    altman: true
    beneish: true
    pe: true
    ps: true
    net_interest_margin: false

# Map a company sector string (from `companies.sector`) to a sector key above.
sector_aliases:
  "Financial Services": bank
  "Banks": bank
  "Technology": standard
  "Consumer Electronics": standard
  "Real Estate": reit
